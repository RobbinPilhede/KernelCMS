name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format

      - name: Unit tests
        run: pnpm test

      - name: Build all packages
        run: pnpm -r run build

      # Guard #11: the PUBLISHED bin (kernelcms/dist/bin.js) must suppress Node's
      # config-load noise. A unit test can't catch a fix that lands only in the dev
      # bin, so exercise the built bin against a typeless-package.json config.
      - name: Published CLI is quiet on a typeless config
        run: |
          out=$(node packages/kernelcms/dist/bin.js doctor --config e2e/fixtures/typeless/kernel.config.ts 2>&1) || true
          echo "$out"
          if echo "$out" | grep -Eiq "MODULE_TYPELESS_PACKAGE_JSON|ExperimentalWarning"; then
            echo "::error::CLI leaked a suppressed warning"; exit 1
          fi

  windows:
    name: Windows (typecheck, tests & clean CLI exit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Regression for the libuv UV_HANDLE_CLOSING abort: a config that fails to
      # load must print the error and exit with code 1 — not crash on teardown.
      - name: CLI exits 1 on a bad config (no libuv abort)
        shell: pwsh
        run: |
          # Call tsx directly (not `pnpm kernel`) to avoid pnpm's own ELIFECYCLE
          # exit-code propagation, and capture the code before it's clobbered.
          pnpm exec tsx packages/cli/src/bin.ts doctor --config ./e2e/fixtures/bad.config.ts
          $code = $LASTEXITCODE
          if ($code -ne 1) {
            Write-Error "Expected exit code 1 from a bad config, got $code"
            exit 1
          }
          Write-Host "OK: bad config exited 1 cleanly"
          # End the step successfully — GitHub's pwsh wrapper appends `exit $LASTEXITCODE`,
          # which would otherwise still be 1 from the CLI call above.
          exit 0

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
